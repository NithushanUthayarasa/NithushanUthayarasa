<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-labelledby="title desc">
  <title id="title">Engineered with curiosity in Jaffna, Sri Lanka</title>
  <desc id="desc">Animated cyan and blue waves flow behind a short closing message.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081326"/><stop offset="1" stop-color="#0C2947"/></linearGradient><linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#165B8A"/><stop offset=".5" stop-color="#52D8ED"/><stop offset="1" stop-color="#165B8A"/></linearGradient></defs>
  <rect width="1200" height="124" rx="16" fill="url(#bg)"/>
  <path d="M0 91C214 44 341 118 560 77S916 51 1200 89" fill="none" stroke="url(#stroke)" stroke-width="2" opacity=".57"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 91C214 44 341 118 560 77S916 51 1200 89;M0 76C201 112 347 52 560 90S922 114 1200 73;M0 91C214 44 341 118 560 77S916 51 1200 89"/></path>
  <path d="M0 104C250 75 360 129 594 100S953 87 1200 110" fill="none" stroke="#3589D8" stroke-opacity=".3"/>
  <text x="600" y="52" text-anchor="middle" fill="#EAF8FF" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ENGINEERED WITH CURIOSITY</text>
  <text x="600" y="76" text-anchor="middle" fill="#7ECDE5" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">JAFFNA, SRI LANKA  •  NITHUSHAN UTHAYARASA</text>
  <circle cx="374" cy="45" r="3" fill="#5BE4EF"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="826" cy="45" r="3" fill="#5BE4EF"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
</svg>
