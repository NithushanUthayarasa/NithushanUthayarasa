name: Generate contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NithushanUthayarasa
          outputs: |
            dist/github-snake.svg?color_snake=#0EA5E9&color_dots=#E8F4FB,#BCECF7,#78D9EE,#38BDF8,#1D7FC0
            dist/github-snake-dark.svg?color_snake=#37D5F5&color_dots=#0B1730,#123755,#145377,#176F9D,#38BDF8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
